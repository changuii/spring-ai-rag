<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring AI RAG</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e4e8;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --user-bubble: #2563eb;
    --assistant-bubble: #eef0f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
  }
  .sidebar {
    width: 340px;
    min-width: 340px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
  }
  .sidebar h1 {
    font-size: 16px;
    margin: 0 0 4px;
  }
  .sidebar .subtitle {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .section {
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .section:last-child { border-bottom: none; }
  .section h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  textarea, input[type="text"] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    margin-bottom: 8px;
  }
  textarea { min-height: 70px; }
  button {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-fg);
    width: 100%;
  }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button + button { margin-top: 6px; }
  .file-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .file-row input[type="file"] {
    flex: 1;
    font-size: 12px;
  }
  .file-row button {
    width: auto;
    white-space: nowrap;
  }
  .status {
    font-size: 12px;
    margin-top: 6px;
    min-height: 16px;
  }
  .status.ok { color: #15803d; }
  .status.err { color: #b91c1c; }
  .conv-id {
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
    background: var(--bg);
    padding: 6px 8px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .message {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .message.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .message.pending {
    align-self: flex-start;
    background: var(--assistant-bubble);
    color: var(--muted);
    font-style: italic;
  }
  .composer {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .composer input {
    flex: 1;
    margin-bottom: 0;
  }
  .composer button {
    width: auto;
    padding: 8px 20px;
  }
  .empty-hint {
    color: var(--muted);
    font-size: 13px;
    margin: auto;
    text-align: center;
    max-width: 320px;
  }
</style>
</head>
<body>

<div class="sidebar">
  <h1>Spring AI RAG</h1>
  <div class="subtitle">Ollama + Chroma 데모 콘솔</div>

  <div class="section">
    <h2>대화</h2>
    <div class="conv-id" id="conv-id-label"></div>
    <button class="secondary" id="new-conversation-btn">새 대화 시작</button>
  </div>

  <div class="section">
    <h2>텍스트 인제스트</h2>
    <textarea id="ingest-text" placeholder="RAG 검색에 쓰일 원문 텍스트를 입력하세요"></textarea>
    <input type="text" id="ingest-source" placeholder="source 메타데이터 (선택)">
    <button id="ingest-text-btn">텍스트 등록</button>
    <div class="status" id="ingest-text-status"></div>
  </div>

  <div class="section">
    <h2>파일 인제스트</h2>
    <div class="file-row">
      <input type="file" id="markdown-file" accept=".md,.markdown">
      <button id="markdown-btn">MD</button>
    </div>
    <div class="file-row">
      <input type="file" id="pdf-file" accept=".pdf">
      <button id="pdf-btn">PDF</button>
    </div>
    <div class="status" id="ingest-file-status"></div>
  </div>
</div>

<div class="chat-area">
  <div class="chat-header">RAG Chat</div>
  <div class="messages" id="messages">
    <div class="empty-hint">왼쪽에서 문서를 먼저 등록한 뒤, 아래에서 질문해보세요.<br>같은 대화 안에서는 이전 내용을 기억합니다.</div>
  </div>
  <div class="composer">
    <input type="text" id="question-input" placeholder="질문을 입력하세요..." autocomplete="off">
    <button id="send-btn">전송</button>
  </div>
</div>

<script>
  const CONV_KEY = 'spring-ai-rag-conversation-id';

  function newConversationId() {
    return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random());
  }

  function getConversationId() {
    let id = localStorage.getItem(CONV_KEY);
    if (!id) {
      id = newConversationId();
      localStorage.setItem(CONV_KEY, id);
    }
    return id;
  }

  let conversationId = getConversationId();

  const convLabel = document.getElementById('conv-id-label');
  const messagesEl = document.getElementById('messages');
  const questionInput = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');
  const newConversationBtn = document.getElementById('new-conversation-btn');

  function renderConvId() {
    convLabel.textContent = 'conversationId: ' + conversationId;
  }
  renderConvId();

  function clearEmptyHint() {
    const hint = messagesEl.querySelector('.empty-hint');
    if (hint) hint.remove();
  }

  function addMessage(role, text) {
    clearEmptyHint();
    const div = document.createElement('div');
    div.className = 'message ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendQuestion() {
    const question = questionInput.value.trim();
    if (!question) return;

    addMessage('user', question);
    questionInput.value = '';
    sendBtn.disabled = true;
    questionInput.disabled = true;
    const pending = addMessage('pending', '생각하는 중... (로컬 모델이라 시간이 걸릴 수 있어요)');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, conversationId })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      pending.remove();
      addMessage('assistant', data.answer);
    } catch (err) {
      pending.remove();
      addMessage('assistant', '오류가 발생했습니다: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      questionInput.disabled = false;
      questionInput.focus();
    }
  }

  sendBtn.addEventListener('click', sendQuestion);
  questionInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendQuestion();
  });

  newConversationBtn.addEventListener('click', async () => {
    try {
      await fetch('/api/chat/' + encodeURIComponent(conversationId), { method: 'DELETE' });
    } catch (err) {
      // ignore network errors on cleanup
    }
    conversationId = newConversationId();
    localStorage.setItem(CONV_KEY, conversationId);
    renderConvId();
    messagesEl.innerHTML = '';
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.innerHTML = '새 대화를 시작했습니다.';
    messagesEl.appendChild(hint);
  });

  function setStatus(el, message, ok) {
    el.textContent = message;
    el.className = 'status ' + (ok ? 'ok' : 'err');
  }

  document.getElementById('ingest-text-btn').addEventListener('click', async () => {
    const content = document.getElementById('ingest-text').value.trim();
    const source = document.getElementById('ingest-source').value.trim();
    const statusEl = document.getElementById('ingest-text-status');
    if (!content) {
      setStatus(statusEl, '내용을 입력하세요.', false);
      return;
    }
    setStatus(statusEl, '등록 중...', true);
    try {
      const res = await fetch('/api/documents/text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content, metadata: source ? { source } : {} })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      setStatus(statusEl, '등록 완료', true);
      document.getElementById('ingest-text').value = '';
    } catch (err) {
      setStatus(statusEl, '실패: ' + err.message, false);
    }
  });

  async function uploadFile(inputId, endpoint, statusEl) {
    const input = document.getElementById(inputId);
    const file = input.files[0];
    if (!file) {
      setStatus(statusEl, '파일을 선택하세요.', false);
      return;
    }
    setStatus(statusEl, '업로드 중...', true);
    const formData = new FormData();
    formData.append('file', file);
    try {
      const res = await fetch(endpoint, { method: 'POST', body: formData });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      setStatus(statusEl, file.name + ' 등록 완료', true);
      input.value = '';
    } catch (err) {
      setStatus(statusEl, '실패: ' + err.message, false);
    }
  }

  document.getElementById('markdown-btn').addEventListener('click', () => {
    uploadFile('markdown-file', '/api/documents/markdown', document.getElementById('ingest-file-status'));
  });
  document.getElementById('pdf-btn').addEventListener('click', () => {
    uploadFile('pdf-file', '/api/documents/pdf', document.getElementById('ingest-file-status'));
  });
</script>
</body>
</html>
